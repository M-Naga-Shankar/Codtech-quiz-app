<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card shadow-lg">
      <div class="card-body">
        <h2 class="card-title text-center mb-4">🧠 Quick Quiz</h2>
        <div id="quiz-container">
          <div id="question" class="fs-4 mb-3"></div>
          <div id="options" class="list-group"></div>
          <div class="mt-4 text-end">
            <button class="btn btn-secondary d-none" id="next-btn">Next</button>
          </div>
        </div>
        <div id="result" class="text-center d-none">
          <h3 class="mt-4">🎉 Quiz Completed!</h3>
          <p id="score" class="lead mt-2"></p>
          <button class="btn btn-primary mt-3" onclick="startQuiz()">Restart Quiz</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
